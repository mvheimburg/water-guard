[project]
name = "water-guard"
version = "0.2.2"
description = "Leak shut-off with a latched, verified main water valve for Home Assistant"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "mvheimburg" }]
requires-python = ">=3.13"
[project.urls]
Homepage = "https://github.com/mvheimburg/water-guard"
Issues = "https://github.com/mvheimburg/water-guard/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
target-version = "py313"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
